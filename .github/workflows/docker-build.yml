# CI/CD: compila as imagens Docker no GitHub e, em push na main, publica no
# GitHub Container Registry (ghcr.io) e faz deploy no servidor via SSH.
# O servidor só baixa as imagens prontas (ele tem pouca RAM para compilar o React).
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST  IP do servidor
#   SSH_USER  usuário SSH (ex.: root)
#   SSH_KEY   chave privada SSH autorizada no servidor
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "Codigo/backend/**"
      - "Codigo/frontend/**"
      - "deploy/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Codigo/backend/**"
      - "Codigo/frontend/**"
      - "deploy/**"
  # Permite rodar o deploy manualmente pela aba Actions
  workflow_dispatch:

jobs:
  # Testes de integração do backend contra um MySQL descartável (escala + segurança)
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: casa_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-senha
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: development
      TZ: America/Sao_Paulo
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci
      DB_PASSWORD: ci-senha
      DB_NAME: casa_ci
      JWT_SECRET: ci-somente-para-testes-0123456789abcdef
    defaults:
      run:
        working-directory: Codigo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Codigo/backend/package-lock.json
      - run: npm ci
      - name: Migrations
        run: npm run migrate
      - name: Dados de exemplo
        run: npm run seed
      - name: Testes da escala
        run: npm run test:escala
      - name: Testes de segurança
        run: npm run test:seguranca

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      web_image: ${{ steps.names.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/casadiscipulos-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/casadiscipulos-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t "${{ steps.names.outputs.backend }}" ./Codigo/backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=/api \
            -t "${{ steps.names.outputs.web }}" \
            ./Codigo/frontend

      # Um nginx.conf inválido derrubaria o site no deploy: testa as duas configs antes
      - name: Validate nginx configs
        run: |
          mkdir -p /tmp/ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=ci" \
            -keyout /tmp/ssl/privkey.pem -out /tmp/ssl/fullchain.pem 2>/dev/null
          cp deploy/nginx/nginx-http.conf /tmp/http.conf
          sed "s/SEU_DOMINIO/casadosdiscipulos.com.br/g" deploy/nginx/nginx-ssl.conf > /tmp/ssl.conf
          for conf in /tmp/http.conf /tmp/ssl.conf; do
            echo "== $conf"
            docker run --rm --add-host backend:127.0.0.1 \
              -v "$conf:/etc/nginx/conf.d/default.conf:ro" \
              -v "/tmp/ssl:/etc/nginx/ssl:ro" \
              "${{ steps.names.outputs.web }}" nginx -t
          done

      - name: Push images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.names.outputs.backend }}"
          docker push "${{ steps.names.outputs.web }}"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Um deploy por vez; um novo push espera o anterior terminar
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://casadosdiscipulos.com.br
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          WEB_IMAGE: ${{ needs.build.outputs.web_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BACKEND_IMAGE,WEB_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -e
            cd /opt/CasaDosDiscipulos
            git fetch origin main
            git checkout main
            git reset --hard "$DEPLOY_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd deploy
            export BACKEND_IMAGE WEB_IMAGE
            bash ./deploy.sh || { docker logout ghcr.io; exit 1; }
            docker logout ghcr.io
            docker image prune -af --filter "until=72h"
