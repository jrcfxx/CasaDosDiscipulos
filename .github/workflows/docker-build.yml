# CI/CD: valida que as imagens Docker compilam e, em push na main,
# faz deploy automático no servidor via SSH.
#
# Secrets necessários (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST  IP do servidor (ex.: 147.182.211.209)
#   SSH_USER  usuário SSH (ex.: root)
#   SSH_KEY   chave privada SSH autorizada no servidor
name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "Codigo/backend/**"
      - "Codigo/frontend/**"
      - "deploy/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Codigo/backend/**"
      - "Codigo/frontend/**"
      - "deploy/**"
  # Permite rodar o deploy manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t casadiscipulos-backend:ci ./Codigo/backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=/api \
            -t casadiscipulos-web:ci \
            ./Codigo/frontend

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Um deploy por vez; um novo push espera o anterior terminar
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://casadosdiscipulos.com.br
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/CasaDosDiscipulos
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            cd deploy
            ./deploy.sh
            docker image prune -f
