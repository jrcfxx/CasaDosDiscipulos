# Casa dos Discípulos - Deploy em Produção
# Uso: cp .env.example .env, configure as variáveis, execute:
#       docker-compose build && docker-compose up -d

version: "3.9"

services:
  # ============ WEB - Frontend + Nginx (reverse proxy) ============
  web:
    build:
      context: ../Codigo/frontend
      dockerfile: Dockerfile
      args:
        # Em produção, a API está no mesmo domínio - path relativo
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    image: casadiscipulos-web:latest
    container_name: casadiscipulos_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-net

  # ============ BACKEND - Node.js API ============
  backend:
    build:
      context: ../Codigo/backend
      dockerfile: Dockerfile
    image: casadiscipulos-backend:latest
    container_name: casadiscipulos_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-casadosdiscipulos}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  # ============ MYSQL - Banco de dados ============
  mysql:
    image: mysql:8.0
    container_name: casadiscipulos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # ============ EVOLUTION API - WhatsApp ============
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: casadiscipulos_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"  # Acesso para criar instância e escanear QR Code
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CORS_ORIGIN: "*"
      LOG_LEVEL: INFO
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - app-net

volumes:
  mysql_data:
  backend_uploads:
  evolution_instances:

networks:
  app-net:
    driver: bridge
